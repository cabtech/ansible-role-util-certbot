---
# --------------------------------

name: "Lint Scripts"
on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout"
      uses: actions/checkout@v7
    - name: "Add Packages"
      run: sudo apt install --yes shellcheck
    - name: "shellcheck"
      run: shellcheck --severity=warning --shell=bash files/manage-letsencrypt.sh

